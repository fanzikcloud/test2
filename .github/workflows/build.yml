name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        shell: bash
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build-output.log
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1
      - name: Real client smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon --console=plain runSmokeClient 2>&1 | tee smoke-output.log
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          for name in ['build-output.log', 'smoke-output.log']:
              file = Path(name)
              if file.exists():
                  text = file.read_text(errors='replace')[-18000:]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{text}')
          PYCODE
      - name: Upload mod
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fanzik-client-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ runner.os }}
          path: |
            build-output.log
            smoke-output.log
            build/smoke-run/smoke-result.txt
            build/reports/tests/
            build/test-results/
            build/smoke-run/logs/latest.log
            build/smoke-run/screenshots/
            build/smoke-run/crash-reports/
          if-no-files-found: ignore
