name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - name: Build and unit tests
        shell: bash
        run: ./gradlew --no-daemon --console=plain build 2>&1 | tee build-output.log
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1
      - name: Real client smoke test
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon --console=plain runSmokeClient 2>&1 | tee smoke-output.log
      - name: Verify release and test evidence
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python scripts/verify_artifacts.py --smoke
          else
            python scripts/verify_artifacts.py
          fi
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          for name in ['build-output.log', 'smoke-output.log']:
              file = Path(name)
              if file.exists():
                  text = file.read_text(errors='replace')[-18000:]
                  for offset in range(0, len(text), 3000):
                      part = text[offset:offset + 3000]
                      part = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title={name} part {offset // 3000 + 1}::{part}')
          PYCODE
      - name: Upload mod
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fanzik-client-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reports-${{ runner.os }}
          path: |
            build-output.log
            smoke-output.log
            build/smoke-run/smoke-result.txt
            build/reports/tests/
            build/test-results/
            build/smoke-run/logs/latest.log
            build/smoke-run/screenshots/
            build/smoke-run/crash-reports/
          if-no-files-found: ignore
